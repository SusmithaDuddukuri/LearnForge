[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learnforge-platform"
version = "1.1.0"
description = "A learning management platform with course discovery, persistent progress, quizzes, and study planning."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Flask==3.1.0",
  "blinker==1.9.0",
  "click==8.1.8",
  "itsdangerous==2.2.0",
  "Jinja2==3.1.5",
  "MarkupSafe==3.0.2",
  "Werkzeug==3.1.3",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
